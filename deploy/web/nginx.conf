map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls.crt;
    ssl_certificate_key /etc/nginx/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Includes redirects, health, assets, media, API and WebSocket handshakes.
    auth_basic "Shared terminals";
    auth_basic_user_file /etc/nginx/htpasswd;

    # Resolve again after a sibling container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $terminal http://terminal:8080;
    location / {
        proxy_pass $terminal$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
        client_max_body_size 32k;
    }
}
